<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RelayBot Dashboard Whiskas</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>RelayBot Dashboard</h1>

    <div class="dashboard">
        <div class="card" id="POS">
            <h2>Relaybot</h2>
            <p><strong>Left Wheel:</strong> <span class="left_wheel">--</span></p>
            <p><strong>Right Wheel:</strong> <span class="right_wheel">--</span></p>
            <p><strong>Distance:</strong> <span class="distance">--</span> cm</p>
            <p><strong>Gripper:</strong> <span class="gripper">--</span></p>
            <p><strong>Last Updated:</strong> <span class="time">--</span></p>
        </div>
    </div>
    <p id="arduino-status" style="color: black; font-weight: bold;">
    Arduino not connected
    </p>

    <script src="/static/script.js"></script>
</body>
</html>
